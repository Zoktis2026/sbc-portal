<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBC Portal — Member & Management Portal</title>
  
  <!-- Preconnect to Google servers to speed up the jump -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">

  <!-- WhatsApp & Social Media Preview Tags -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SBC Portal">
  <meta property="og:title" content="SBC Portal">
  <meta property="og:description" content="Official Member & Management Portal — Access records, contributions, receipts, and announcements.">
  <meta property="og:image" content="https://i.imgur.com/au5UZSOl.jpg">
  <meta property="og:image:secure_url" content="https://i.imgur.com/au5UZSOl.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="640">
  <meta property="og:image:height" content="640">

  <!-- Icons for Mobile & Browser -->
  <link rel="icon" type="image/jpeg" href="https://i.imgur.com/au5UZSOl.jpg">
  <link rel="apple-touch-icon" href="https://i.imgur.com/au5UZSOl.jpg">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease-out;
    }
    .splash-logo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      object-fit: contain;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>

  <!-- Fast silent redirect -->
  <script>
    setTimeout(function() {
      window.location.replace("https://script.google.com/macros/s/AKfycbzh67e7m94KrA0H0B_moSsjyD1wuF7P2TUKAlbmrhQkYU0pzWrTsalECJNTlfbijgUu/exec");
    }, 400);
  </script>
</head>
<body>
  <div class="splash">
    <img class="splash-logo" src="https://i.imgur.com/au5UZSOl.jpg" alt="SBC Logo">
  </div>
</body>
</html>
